name: Halal watchlist

on:
  workflow_dispatch: {}
  schedule:
    # Target: once per workday, 07:00 Europe/Berlin, before EU/US markets open.
    # GitHub Actions cron is UTC-only, ignores DST, and often starts runs
    # minutes to hours late, so both the CEST (UTC+2) and CET (UTC+1)
    # equivalents are scheduled and the `check` job decides whether to run:
    # a scheduled run proceeds only if Berlin time is 07:00-12:59 AND today's
    # report doesn't exist yet (so the second cron entry never duplicates it).
    - cron: "0 5 * * 1-5"   # 07:00 CEST (late Mar - late Oct)
    - cron: "0 6 * * 1-5"   # 07:00 CET (late Oct - late Mar)

permissions:
  contents: write

# Serialize runs so a late cron entry can't race the first one's commit.
concurrency:
  group: halal-watchlist
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this run should produce a report
        id: guard
        run: |
          hour=$(TZ=Europe/Berlin date +%-H)
          report="reports/$(date -u +%Y-%m-%d).md"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run -- always proceeding."
          elif [ "$hour" -lt 7 ] || [ "$hour" -gt 12 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping -- Berlin time is ${hour}:xx, outside the 07:00-12:59 window."
          elif [ -f "$report" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping -- $report already exists."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  screen:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          # Optional. If unset, sentiment tagging is skipped entirely and
          # the report is unaffected -- see halal_trader/sentiment.py.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p reports
          python -m halal_trader.cli \
            --universe data/universe_default.csv \
            --out "reports/$(date -u +%Y-%m-%d).md"

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: halal-watchlist-${{ github.run_id }}
          path: reports/*.md

      - name: Commit report to repo
        run: |
          git config user.name "halal-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ track_record/
          git diff --cached --quiet || git commit -m "Halal watchlist $(date -u +%Y-%m-%d)"
          git push
