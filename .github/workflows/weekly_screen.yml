name: Weekly halal watchlist

on:
  workflow_dispatch: {}
  schedule:
    # 06:00 UTC every Monday (before most European/US markets open).
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: |
          mkdir -p reports
          python -m halal_trader.cli \
            --universe data/universe_default.csv \
            --out "reports/$(date -u +%Y-%m-%d).md"

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: halal-watchlist-${{ github.run_id }}
          path: reports/*.md

      - name: Commit report to repo
        run: |
          git config user.name "halal-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Weekly halal watchlist $(date -u +%Y-%m-%d)"
          git push
