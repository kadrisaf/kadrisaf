name: Halal watchlist

on:
  workflow_dispatch: {}
  schedule:
    # 07:00 Europe/Berlin, Mon-Fri, before European/US markets open.
    # GitHub Actions cron is UTC-only and ignores DST, so both the CEST
    # (summer, UTC+2) and CET (winter, UTC+1) equivalents are scheduled;
    # the `check` job below only lets the one that currently matches
    # 07:00 Berlin time actually run the screen, so this fires once a day.
    - cron: "0 5 * * 1-5"   # 07:00 CEST (late Mar - late Oct)
    - cron: "0 6 * * 1-5"   # 07:00 CET (late Oct - late Mar)

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Only proceed if it's actually 07:00 in Berlin right now
        id: guard
        run: |
          hour=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "07" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping -- Europe/Berlin local time is ${hour}:00, not 07:00 (this cron entry is for the other half of the year's DST offset)."
          fi

  screen:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          # Optional. If unset, sentiment tagging is skipped entirely and
          # the report is unaffected -- see halal_trader/sentiment.py.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p reports
          python -m halal_trader.cli \
            --universe data/universe_default.csv \
            --out "reports/$(date -u +%Y-%m-%d).md"

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: halal-watchlist-${{ github.run_id }}
          path: reports/*.md

      - name: Commit report to repo
        run: |
          git config user.name "halal-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ track_record/
          git diff --cached --quiet || git commit -m "Halal watchlist $(date -u +%Y-%m-%d)"
          git push
