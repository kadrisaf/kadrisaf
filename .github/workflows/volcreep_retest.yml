name: vol_creep retest

# Twice-yearly re-run of the vol_creep gate split-sample test
# (halal_trader/tune_volcreep.py). Scheduled 2026-11-09 after the first
# run was NOT adopted: gates >=1.3x helped only in the validation half
# (mid-2024..2026) and hurt in training -- regime-dependent or emerging,
# undecidable at the time. Each re-run adds ~6 months of data that no
# half of the original test ever saw. Decision rule unchanged and
# pre-registered in the report itself: adopt only if a gate beats the
# LIVE baseline's validation avg by a clear margin with a comparable
# trade count. First firing: 2027-05-09.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 9 5,11 *"   # 07:00 UTC on May 9 and Nov 9

permissions:
  contents: write

concurrency:
  group: volcreep-retest
  cancel-in-progress: false

jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Guard - once per scheduled date
        id: guard
        run: |
          today=$(date -u +%F)
          if [ -f "backtests/$today-tune-volcreep.md" ]; then
            echo "Retest for $today already exists -- skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run the vol_creep gate retest
        if: steps.guard.outputs.run == 'true'
        run: python -m halal_trader.tune_volcreep

      - name: Commit the report
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "halal-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/
          git diff --cached --quiet || git commit -m "Scheduled vol_creep gate retest $(date -u +%F)

          Re-run of the 2026-11-09 split-sample test with ~6 more months
          of out-of-sample data. See the report's pre-registered decision
          rule before acting on it."
          git push
