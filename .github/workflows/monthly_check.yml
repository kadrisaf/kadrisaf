name: Monthly self-check

# Re-runs the backtest, the split-sample tune and the universe-health scan
# on the 1st of each month and commits the results to backtests/auto/.
# Honest systems re-test themselves: if the (lack of) edge drifts, the
# evidence updates itself instead of waiting for someone to ask.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: write

concurrency:
  group: monthly-check
  cancel-in-progress: false

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest, tune and universe health
        run: |
          stamp=$(date -u +%Y-%m)
          mkdir -p backtests/auto
          python -m halal_trader.backtest --years 3 --out "backtests/auto/${stamp}-backtest.md"
          python -m halal_trader.tune --years 3 --out "backtests/auto/${stamp}-tune.md"
          python -m halal_trader.universe_health --days 30 --out "backtests/auto/${stamp}-universe.md"

      - name: Commit results
        run: |
          git config user.name "halal-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/auto/
          git diff --cached --quiet || git commit -m "Monthly self-check $(date -u +%Y-%m)"
          git push
